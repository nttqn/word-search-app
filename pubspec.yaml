name: wordhunt
description: "WordHunt - Tra Từ: an English vocabulary word-search game."
publish_to: 'none'
version: 1.1.0+12

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.2.3
  # Pinned: 2.5.0 (2026-10-17) rewrote the Android side on Pigeon JNI, and in
  # this app's R8-minified release build it broke getInstance() on a real
  # device — scores never saved, daily-challenge completion never persisted.
  # 2.4.28 is the last pre-JNI release (what every 1.0.0 build used). See
  # CLAUDE.md before unpinning.
  shared_preferences_android: 2.4.28
  games_services: ^5.3.0
  flame_audio: ^2.12.2
  flutter_tts: 4.2.5
  # Pinned to a release that had been out for weeks when added (22.3.3
  # was 2 days old) — see the shared_preferences_android note above.
  flutter_local_notifications: 22.3.1
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/title/title.png
    - assets/audio/sfx_menu_confirm.wav
    - assets/audio/sfx_menu_back.wav
    - assets/audio/sfx_hint.wav
    - assets/audio/sfx_correct.wav
    - assets/audio/sfx_wrong.wav
    - assets/audio/m_win.mp3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
